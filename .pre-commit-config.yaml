repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --force-exclude
        language: python
        additional_dependencies: [ruff]
        types_or: [python]

      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: python
        additional_dependencies: [ruff]
        types_or: [python]

      - id: mypy
        name: mypy
        entry: mypy
        language: python
        additional_dependencies: [mypy]
        pass_filenames: false
        types_or: [python]